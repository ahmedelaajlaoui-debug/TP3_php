<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 4.3 - Saisie des Notes (POST)</title>
</head>
<body>
    <h2>Saisie des notes de l'étudiant</h2>
    <form action="traitement.php" method="POST">
        <label for="nom">Nom de l'étudiant :</label>
        <input type="text" id="nom" name="nom"><br><br>

        <label for="note_info">Note Informatique (0 à 20) :</label>
        <input type="number" id="note_info" name="note_info" step="0.25"><br><br>

        <label for="note_math">Note Mathématiques (0 à 20) :</label>
        <input type="number" id="note_math" name="note_math" step="0.25"><br><br>

        <input type="submit" value="Enregistrer">
    </form>
</body>
</html>
